name: Deploy to quantum-s5sr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_Y4UY5ZWrjL0W6BZ24KEMhAqsoOHh
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remove stale project link
        run: rm -f .vercel/project.json

      - name: Resolve Vercel org ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Resolving org ID ==="
          PROJECT_RESP=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_Y4UY5ZWrjL0W6BZ24KEMhAqsoOHh" 2>&1 || echo "{}")
          echo "Project API response: $(echo $PROJECT_RESP | head -c 200)"
          ORG_ID=$(echo "$PROJECT_RESP" | jq -r '.accountId // empty' 2>/dev/null || true)
          if [ -z "$ORG_ID" ]; then
            USER_RESP=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/user" 2>&1 || echo "{}")
            echo "User API response: $(echo $USER_RESP | head -c 200)"
            ORG_ID=$(echo "$USER_RESP" | jq -r '.user.id // empty' 2>/dev/null || true)
          fi
          echo "Resolved org ID: $ORG_ID"
          [ -n "$ORG_ID" ] && echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV || true

      - name: Pull Vercel project config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Pulling Vercel config ==="
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          echo "=== Pull complete — project.json: ==="
          cat .vercel/project.json 2>/dev/null || echo "(not created)"

      - name: Sync GEMINI_API_KEY to Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Syncing GEMINI_API_KEY ==="
          EXISTING=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/prj_Y4UY5ZWrjL0W6BZ24KEMhAqsoOHh/env" | \
            jq -r '.envs // [] | .[] | select(.key == "GEMINI_API_KEY") | .id' | head -1)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Updating existing GEMINI_API_KEY (id: $EXISTING)"
            curl -s -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/prj_Y4UY5ZWrjL0W6BZ24KEMhAqsoOHh/env/$EXISTING" \
              -d "$(jq -n --arg v "$GEMINI_KEY" '{value: $v, type: "encrypted", target: ["production","preview","development"]}')" || true
          else
            echo "Creating new GEMINI_API_KEY"
            curl -s -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/prj_Y4UY5ZWrjL0W6BZ24KEMhAqsoOHh/env" \
              -d "$(jq -n --arg k "GEMINI_API_KEY" --arg v "$GEMINI_KEY" '{key: $k, value: $v, type: "encrypted", target: ["production","preview","development"]}')" || true
          fi

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Starting Vercel deploy ==="
          vercel deploy --prod --yes --token=$VERCEL_TOKEN
          echo "=== Deploy complete ==="
